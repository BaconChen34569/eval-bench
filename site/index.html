<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="课设 Copilot 评测台：在 Flask 3.1.3 上用 22 道人工标注的代码问答题，量化不同代码切分策略下的检索召回率，定位 AI 代码助手的失败位置。"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" />
    <title>课设 Copilot 评测台 · 量化代码 Agent 在哪里失败</title>
    <script>
      // 首帧前定好主题，避免刷新时闪一下白底。
      (function () {
        try {
          var stored = localStorage.getItem("eval-bench-theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.classList.toggle("light", !dark);
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", dark ? "#0a0a0a" : "#ffffff");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
