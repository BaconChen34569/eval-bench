<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="课设 Copilot 本地评测工作台：粘一份报告就出图，录一套题就跑检索评测。"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <meta name="theme-color" content="#ffffff" />
    <title>本地评测工作台 · 课设 Copilot</title>
    <script>
      // 首帧前定好主题，避免刷新时闪一下白底。
      (function () {
        try {
          var stored = localStorage.getItem("eval-bench-theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.classList.toggle("light", !dark);
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", dark ? "#0a0a0a" : "#ffffff");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/local.tsx"></script>
  </body>
</html>
